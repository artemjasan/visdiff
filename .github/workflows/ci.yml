name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '22.12.0', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace packages/visdiff
      - run: npm run lint
        if: matrix.node-version == '20.19.0'
      - run: npm run typecheck
      - run: npm run build --workspace packages/visdiff
      - run: npx playwright install --with-deps chromium
        if: matrix.node-version == '20.19.0'
      - run: npm run test:e2e
        if: matrix.node-version == '20.19.0'
      - run: npm run docs:build

  tag-build:
    name: Tag successful main build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Create build tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$tag" "$GITHUB_SHA" -m "Successful CI build ${GITHUB_RUN_NUMBER}"
          git push origin "$tag"
